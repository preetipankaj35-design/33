    <script>
      /* Derive every app-facing metadata value from window.appInformation. */
      (function () {
        var ai = window.appInformation || {};
        var name = ai.name || "FinPulse";
        var iconType = (String(ai.icon || "").match(/^data:([^;,]+)[;,]/) || [])[1] || "image/png";
        document.title = name;
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", name + " - Mobile financial market information");
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appleTitle) appleTitle.setAttribute("content", name);
        if (ai.icon) {
          var iconLink = document.querySelector('link[rel="icon"]');
          if (iconLink) {
            iconLink.href = ai.icon;
            iconLink.setAttribute("type", iconType);
          }
          var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleIcon) appleIcon.href = ai.icon;
        }
        /* Rebuild the PWA manifest from the global app information. */
        function writeManifest(sizes) {
          var manifest = {
            name: name,
            short_name: name,
            description: "Mobile financial market information",
            start_url: new URL("./", location.href).href,
            scope: new URL("./", location.href).href,
            display: "standalone",
            orientation: "portrait",
            background_color: "#ffffff",
            theme_color: "#0A5CFF",
            icons: ai.icon ? [{ src: ai.icon, sizes: sizes, type: iconType, purpose: "any" }] : []
          };
          var url = URL.createObjectURL(
            new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" })
          );
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.href = url;
        }
        if (ai.icon) {
          var probe = new Image();
          probe.onload = function () { writeManifest(probe.naturalWidth + "x" + probe.naturalHeight); };
          probe.onerror = function () { writeManifest("512x512"); };
          probe.src = ai.icon;
        } else {
          writeManifest("512x512");
        }
      })();
